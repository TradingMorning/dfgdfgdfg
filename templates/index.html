<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Direct YT Downloader (No Ads, No Redirects)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 selection:bg-red-500 selection:text-white">

  <!-- Header -->
  <header class="w-full max-w-4xl py-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 to-rose-500 flex items-center justify-center shadow-lg shadow-red-600/30">
        <i class="fa-solid fa-play text-white text-lg"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-red-400 to-rose-200 bg-clip-text text-transparent">Direct Stream Hub</h1>
        <p class="text-xs text-emerald-400 font-medium">⚡ 100% Direct File Download • No Ads • No Redirects</p>
      </div>
    </div>
    <span class="px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold rounded-full flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      Direct CDN
    </span>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-4xl space-y-6">
    
    <!-- Input Box -->
    <div class="glass-card rounded-2xl p-6 shadow-2xl">
      <h2 class="text-base font-semibold text-slate-200 mb-1">Enter YouTube Link</h2>
      <p class="text-xs text-slate-400 mb-4">Paste any YouTube URL to extract direct high-speed downloadable video & audio streams.</p>
      
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-link text-sm"></i>
          </div>
          <input 
            type="url" 
            id="videoUrl" 
            placeholder="https://www.youtube.com/watch?v=... or https://youtu.be/..." 
            class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-red-500 text-sm transition"
          />
        </div>
        <button 
          id="fetchBtn" 
          onclick="extractFormats()" 
          class="px-6 py-3 bg-red-600 hover:bg-red-500 active:scale-95 text-white text-sm font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-red-600/25"
        >
          <span id="btnText">Get Formats</span>
          <i id="btnIcon" class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
      
      <div id="errorMsg" class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-xs text-red-400 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText"></span>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden glass-card rounded-2xl p-10 text-center space-y-3">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-700 border-t-red-500"></div>
      <p class="text-sm font-medium text-slate-300">Extracting Direct Google CDN Streams...</p>
      <p class="text-xs text-slate-500">Resolving clean video & audio streams</p>
    </div>

    <!-- Video Result Section -->
    <div id="results" class="hidden space-y-6">
      
      <!-- Video Metadata Header Card -->
      <div class="glass-card rounded-2xl p-6 flex flex-col md:flex-row gap-6 items-start">
        <div class="w-full md:w-64 aspect-video rounded-xl overflow-hidden bg-slate-900 relative flex-shrink-0 shadow-lg border border-slate-800">
          <img id="resThumb" src="" alt="Thumbnail" class="w-full h-full object-cover" />
          <span id="resDuration" class="absolute bottom-2 right-2 bg-black/80 px-2 py-0.5 rounded text-[11px] font-mono font-medium text-white"></span>
        </div>
        <div class="flex-1 min-w-0 space-y-3">
          <h3 id="resTitle" class="text-base sm:text-lg font-bold text-slate-100 line-clamp-2"></h3>
          <div class="flex items-center gap-2 text-xs text-slate-400">
            <i class="fa-solid fa-user-circle text-slate-500"></i>
            <span id="resChannel" class="text-slate-300 font-medium"></span>
          </div>

          <!-- Format Category Tabs -->
          <div class="flex gap-2 pt-2">
            <button id="tabVideo" onclick="switchTab('video')" class="px-4 py-1.5 bg-red-600 text-white text-xs font-semibold rounded-lg transition shadow-md shadow-red-600/20">
              <i class="fa-solid fa-video mr-1.5"></i> Video Formats (<span id="videoCount">0</span>)
            </button>
            <button id="tabAudio" onclick="switchTab('audio')" class="px-4 py-1.5 bg-slate-800 text-slate-400 hover:text-white text-xs font-semibold rounded-lg transition">
              <i class="fa-solid fa-music mr-1.5"></i> Audio Only (<span id="audioCount">0</span>)
            </button>
          </div>
        </div>
      </div>

      <!-- Formats Container -->
      <div class="glass-card rounded-2xl p-6">
        <!-- Video Formats Table -->
        <div id="videoFormats" class="space-y-3"></div>

        <!-- Audio Formats Table -->
        <div id="audioFormats" class="hidden space-y-3"></div>
      </div>
    </div>
  </main>

  <script>
    let currentVideoId = '';

    function switchTab(type) {
      const tabVideo = document.getElementById('tabVideo');
      const tabAudio = document.getElementById('tabAudio');
      const videoFormats = document.getElementById('videoFormats');
      const audioFormats = document.getElementById('audioFormats');

      if (type === 'video') {
        tabVideo.className = 'px-4 py-1.5 bg-red-600 text-white text-xs font-semibold rounded-lg transition shadow-md shadow-red-600/20';
        tabAudio.className = 'px-4 py-1.5 bg-slate-800 text-slate-400 hover:text-white text-xs font-semibold rounded-lg transition';
        videoFormats.classList.remove('hidden');
        audioFormats.classList.add('hidden');
      } else {
        tabAudio.className = 'px-4 py-1.5 bg-red-600 text-white text-xs font-semibold rounded-lg transition shadow-md shadow-red-600/20';
        tabVideo.className = 'px-4 py-1.5 bg-slate-800 text-slate-400 hover:text-white text-xs font-semibold rounded-lg transition';
        audioFormats.classList.remove('hidden');
        videoFormats.classList.add('hidden');
      }
    }

    async function extractFormats() {
      const url = document.getElementById('videoUrl').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');
      const loading = document.getElementById('loading');
      const results = document.getElementById('results');
      const fetchBtn = document.getElementById('fetchBtn');

      if (!url) {
        errorText.textContent = 'Please paste a valid YouTube video link.';
        errorMsg.classList.remove('hidden');
        return;
      }

      errorMsg.classList.add('hidden');
      results.classList.add('hidden');
      loading.classList.remove('hidden');
      fetchBtn.disabled = true;

      try {
        const response = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();
        if (!data.success) {
          throw new Error(data.error || 'Failed to extract video formats.');
        }

        currentVideoId = data.video_id;

        document.getElementById('resThumb').src = data.thumbnail;
        document.getElementById('resTitle').textContent = data.title;
        document.getElementById('resChannel').textContent = data.uploader;
        document.getElementById('resDuration').textContent = data.duration;
        document.getElementById('videoCount').textContent = data.video_formats.length;
        document.getElementById('audioCount').textContent = data.audio_formats.length;

        // Render Video Formats
        const videoContainer = document.getElementById('videoFormats');
        videoContainer.innerHTML = '';
        data.video_formats.forEach(v => {
          const card = document.createElement('div');
          card.className = 'flex items-center justify-between p-3.5 bg-slate-900/90 hover:bg-slate-900 border border-slate-800 rounded-xl transition';
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 bg-purple-500/10 border border-purple-500/30 text-purple-400 font-bold text-xs rounded-lg">
                ${v.resolution}
              </span>
              <div>
                <div class="text-sm font-semibold text-slate-200">${v.ext.toUpperCase()} ${v.has_audio ? '<span class="text-xs text-emerald-400 font-normal">(Video + Audio)</span>' : '<span class="text-xs text-amber-400 font-normal">(Video Stream)</span>'}</div>
                <div class="text-[11px] text-slate-400">File Size: ${v.filesize}</div>
              </div>
            </div>
            <a href="/api/download?id=${currentVideoId}&format_id=${v.format_id}&type=video" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shadow-md shadow-red-600/20 active:scale-95">
              <i class="fa-solid fa-download"></i>
              <span>Save File</span>
            </a>
          `;
          videoContainer.appendChild(card);
        });

        // Render Audio Formats
        const audioContainer = document.getElementById('audioFormats');
        audioContainer.innerHTML = '';
        data.audio_formats.forEach(a => {
          const card = document.createElement('div');
          card.className = 'flex items-center justify-between p-3.5 bg-slate-900/90 hover:bg-slate-900 border border-slate-800 rounded-xl transition';
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold text-xs rounded-lg">
                ${a.ext.toUpperCase()}
              </span>
              <div>
                <div class="text-sm font-semibold text-slate-200">Quality: ${a.quality}</div>
                <div class="text-[11px] text-slate-400">File Size: ${a.filesize}</div>
              </div>
            </div>
            <a href="/api/download?id=${currentVideoId}&format_id=${a.format_id}&type=audio" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1.5 shadow-md shadow-amber-600/20 active:scale-95">
              <i class="fa-solid fa-music"></i>
              <span>Save Audio</span>
            </a>
          `;
          audioContainer.appendChild(card);
        });

        results.classList.remove('hidden');

      } catch (err) {
        errorText.textContent = err.message;
        errorMsg.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        fetchBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
